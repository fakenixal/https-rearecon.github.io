<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<title>Alumni – Rear Global</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Typography -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" type="image/jpeg" href="favicon.jpeg">

<style>
/* Rear Econ Color Scheme */
:root {
  --primary: #1F3B57;      /* Rear Econ dark blue */
  --accent: #2F80ED;       /* Rear Econ bright blue */
  --bg: #F7F9FC;           /* Soft background */
  --text: #1A1A1A;
  --muted: #6B7280;
  --border: #E5E7EB;
  --radius: 18px;
  --shadow: 0 8px 24px rgba(0,0,0,0.06);
}

body {
  margin: 0;
  font-family: "Plus Jakarta Sans", sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* NAVBAR */
header {
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 50;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.nav {
  max-width: 1200px;
  margin: auto;
  padding: 1rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav {
  display: flex;
  gap: 1.8rem;
}

nav a {
  text-decoration: none;
  color: var(--muted);
  font-size: 0.9rem;
  transition: 0.2s ease;
}

nav a:hover {
  color: var(--primary);
}

/* HERO */
.hero {
  padding: 10rem 1.5rem 5rem;
  text-align: center;
  background: linear-gradient(135deg, #eaf2ff, #ffffff);
}

.hero h1 {
  font-size: 3rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 1rem;
}

.hero p {
  font-size: 1.2rem;
  color: var(--muted);
  max-width: 700px;
  margin: auto;
}

/* ALUMNI GRID */
.alumni-grid {
  max-width: 1200px;
  margin: auto;
  padding: 4rem 1.5rem;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 2rem;
}

.alumni-card {
  background: #ffffff;
  border-radius: var(--radius);
  padding: 2rem;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  text-align: center;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.alumni-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 32px rgba(0,0,0,0.10);
}

.alumni-card img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 1rem;
  border: 3px solid var(--accent); /* Rear Econ blue accent */
}

.alumni-card h3 {
  margin: 0;
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--primary);
}

.alumni-card p {
  color: var(--muted);
  font-size: 0.9rem;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header>
  <div class="nav">
    <div class="logo">
      <a href="index.html">
        <img src="rear-econ-logo.png" alt="Rear Global Logo" style="height:60px;">
      </a>
    </div>

    <nav>
      <a href="index.html#work">Work</a>
      <a href="aemm.html">AEMM</a>
      <a href="tlae.html">TLAE</a>
      <a href="twg.html">TWG</a>
      <a href="index.html#team">Team</a>
      <a href="alumni.html" style="color:var(--primary); font-weight:600;">Alumni</a>
      <a href="index.html#videos">Videos</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Rear Global Alumni</h1>
  <p>Celebrating the students and researchers who completed their journey with Rear Econ and Rear Global.</p>
</section>

<!-- ALUMNI GRID -->
<section class="alumni-grid">

  <div class="alumni-card">
    <img src="alumni1.jpg" alt="Alumni Photo">
    <h3>Alumni Name</h3>
    <p>Role / Achievement</p>
  </div>

  <div class="alumni-card">
    <img src="alumni2.jpg" alt="Alumni Photo">
    <h3>Alumni Name</h3>
    <p>Role / Achievement</p>
  </div>

</section>

</body>
</html>
